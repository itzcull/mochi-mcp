name: Publish

on:
  push:
    tags:
      - "v*"

# One publish at a time. Every other tag run waits instead of being cancelled.
concurrency:
  group: publish
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing (OIDC) and provenance
    # Actions are pinned to commits because this job can publish to npm.
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node v7.1.0
      # Reads devEngines.runtime from package.json. registry-url writes the
      # .npmrc that pnpm reads NODE_AUTH_TOKEN from.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # pnpm/action-setup v6.1.1
      # Reads devEngines.packageManager from package.json. pnpm then runs the
      # version recorded in pnpm-lock.yaml.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115

      - run: pnpm install --frozen-lockfile

      # Build explicitly: prepack does not run when ignore-scripts is set.
      - run: pnpm run build

      - name: Read package
        run: |
          {
            echo "PACKAGE_NAME=$(jq -r .name package.json)"
            echo "PACKAGE_VERSION=$(jq -r .version package.json)"
          } >> "$GITHUB_ENV"

      - name: Check tag matches package version
        run: |
          if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME must be v$PACKAGE_VERSION"
            exit 1
          fi

      # Skipping an existing version lets a failed run be re-run, and lets a
      # version published by hand still get its GitHub release.
      # pnpm supports trusted publishing (OIDC). NODE_AUTH_TOKEN is the token
      # for publishes without it. --provenance asks for provenance in both cases.
      # --no-git-checks: the job runs on a tag checkout, and the tag check above
      # already decides what gets published.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          spec="$PACKAGE_NAME@$PACKAGE_VERSION"
          if pnpm view "$spec" version > /dev/null 2>&1; then
            echo "$spec is already on npm; skipping publish"
          else
            pnpm publish --provenance --no-git-checks
          fi

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
