name: Publish

on:
  push:
    tags:
      - "v*"

# One publish at a time. Every other tag run waits instead of being cancelled.
concurrency:
  group: publish
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing (OIDC) and provenance
    # Actions are pinned to commits because this job can publish to npm.
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          no-cache: true

      # actions/setup-node v7.1.0
      # Trusted publishing needs npm >= 11.5.1, which Node 24 provides.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - run: bunx tsc --noEmit

      - name: Read package
        run: |
          {
            echo "PACKAGE_NAME=$(jq -r .name package.json)"
            echo "PACKAGE_VERSION=$(jq -r .version package.json)"
          } >> "$GITHUB_ENV"

      - name: Check tag matches package version
        run: |
          if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME must be v$PACKAGE_VERSION"
            exit 1
          fi

      # Skipping an existing version lets a failed run be re-run, and lets a
      # version published by hand still get its GitHub release.
      # npm tries trusted publishing (OIDC) first and falls back to this token.
      # Token publishes get provenance only with --provenance.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          spec="$PACKAGE_NAME@$PACKAGE_VERSION"
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "$spec is already on npm; skipping publish"
          else
            npm publish --provenance
          fi

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
